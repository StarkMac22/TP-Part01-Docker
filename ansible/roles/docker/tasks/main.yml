
---
# Installation et configuration de Docker

- name: Install required packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: true

- name: Create Docker keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker official repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' if ansible_facts['architecture'] == 'aarch64' else ansible_facts['architecture'] }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Create virtual environment for Docker SDK
  ansible.builtin.command:
    cmd: python3 -m venv /opt/docker_venv
    creates: /opt/docker_venv/bin/python

- name: Install Docker SDK in virtual environment
  ansible.builtin.pip:
    name: docker
    virtualenv: /opt/docker_venv
    state: present

- name: Make sure Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Check Docker version
  ansible.builtin.command:
    cmd: docker --version
  register: docker_version
  changed_when: false

- name: Display Docker version
  ansible.builtin.debug:
    var: docker_version.stdout

- name: Check Docker daemon
  ansible.builtin.command:
    cmd: docker info
  changed_when: false
