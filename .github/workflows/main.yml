name: CI/CD DevOps

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test with Maven
        run: mvn clean verify --file ./backend/pom.xml

      - name: Analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          --file ./backend/pom.xml
          -Dsonar.projectKey=StarkMac22_TP-Part01-Docker

  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: yand10/tp-backend:${{ github.sha }}

      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: yand10/tp-database:${{ github.sha }}

      - name: Build and push proxy
        uses: docker/build-push-action@v6
        with:
          context: ./httpd
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: yand10/tp-httpd:${{ github.sha }}

  deploy:
    needs: build-and-push-docker-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible and Docker collection
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.docker

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with Ansible
        working-directory: ./ansible
        env:
          ANSIBLE_SSH_PRIVATE_KEY_FILE: /home/runner/.ssh/id_rsa
        run: |
          ansible-playbook -i inventories/setup.yml playbook.yml \
            -e "backend_image=yand10/tp-backend:${{ github.sha }}" \
            -e "database_image=yand10/tp-database:${{ github.sha }}" \
            -e "proxy_image=yand10/tp-httpd:${{ github.sha }}"

      - name: Verify API health
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 5 --retry-connrefused \
            "http://${SSH_HOST}:8080/actuator/health"