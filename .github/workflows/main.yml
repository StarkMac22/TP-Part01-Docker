name: CI/CD DevOps

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test with Maven
        run: mvn clean verify --file ./backend/pom.xml

      - name: Analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          --file ./backend/pom.xml
          -Dsonar.projectKey=StarkMac22_TP-Part01-Docker

  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: yand10/tp-backend:${{ github.sha }}

      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: yand10/tp-database:${{ github.sha }}

      - name: Build and push proxy
        uses: docker/build-push-action@v6
        with:
          context: ./httpd
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: yand10/tp-httpd:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: yand10/tp-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push-docker-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Vault configuration
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          test -n "$ANSIBLE_VAULT_PASSWORD" || { echo "Missing ANSIBLE_VAULT_PASSWORD secret"; exit 1; }
          test -f ansible/vars/vault.yml || { echo "Initialize and add the encrypted Vault file first"; exit 1; }
          grep -q '^[$]ANSIBLE_VAULT;' ansible/vars/vault.yml || { echo "Vault file must be encrypted"; exit 1; }

      - name: Build Ansible controller image
        run: docker build -t tp-ansible:${{ github.sha }} ./ansible/controller

      - name: Configure deployment secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          umask 077
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST"
          mkdir -p "$RUNNER_TEMP/tp-deploy-secrets"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/tp-deploy-secrets/id_rsa"
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$RUNNER_TEMP/tp-deploy-secrets/vault-password"
          ssh-keyscan -H "$SSH_HOST" > "$RUNNER_TEMP/tp-deploy-secrets/known_hosts"

      - name: Check Ansible syntax
        run: |
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE/ansible,dst=/work,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/tp-deploy-secrets,dst=/run/secrets,readonly" \
            -e ANSIBLE_SSH_PRIVATE_KEY_FILE=/run/secrets/id_rsa \
            tp-ansible:${{ github.sha }} \
            -i inventories/setup.yml playbook.yml \
            --vault-password-file /run/secrets/vault-password --syntax-check

      - name: Deploy with Ansible
        run: |
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE/ansible,dst=/work,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/tp-deploy-secrets,dst=/run/secrets,readonly" \
            -e ANSIBLE_SSH_PRIVATE_KEY_FILE=/run/secrets/id_rsa \
            tp-ansible:${{ github.sha }} \
            -i inventories/setup.yml playbook.yml \
            --vault-password-file /run/secrets/vault-password \
            -e "backend_image=yand10/tp-backend:${{ github.sha }}" \
            -e "database_image=yand10/tp-database:${{ github.sha }}" \
            -e "frontend_image=yand10/tp-frontend:${{ github.sha }}" \
            -e "proxy_image=yand10/tp-httpd:${{ github.sha }}"

      - name: Verify API health
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 5 --retry-connrefused \
            "http://${SSH_HOST}:8080/api/actuator/health"

      - name: Remove deployment secrets
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/tp-deploy-secrets"
